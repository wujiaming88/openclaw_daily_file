<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270" role="img" aria-labelledby="title"><title id="title">托管控制面与可选自托管执行面的数据及责任边界示意图</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c899b"/></marker></defs><rect width="100%" height="100%" fill="#f8f7f2"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="56" y="55" font-size="22" font-weight="600" fill="#4f46e5" text-anchor="start">W.ai  /  ENGINEERING NOTES  /  02</text><text x="56" y="120" font-size="48" font-weight="700" fill="#172033" text-anchor="start">控制面与执行面分离</text><text x="56" y="171" font-size="27" font-weight="400" fill="#596579" text-anchor="start">自托管改变执行位置，不把整个 Agent 平台搬回本地。</text><path d="M600 340V413" fill="none" stroke="#7c899b" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 656V738H310V787" fill="none" stroke="#7c899b" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 656V738H890V787" fill="none" stroke="#7c899b" stroke-width="3" marker-end="url(#arrow)"/><rect x="56" y="215" width="1088" height="124" rx="16" fill="#ffffff" stroke="#d8dce3" stroke-width="2"/><text x="84" y="266" font-size="37" font-weight="700" fill="#172033" text-anchor="start">应用 / 企业工作流</text><text x="84" y="312" font-size="29" font-weight="400" fill="#596579" text-anchor="start">下发任务、审批、接收事件；保留最终验收</text><text x="627" y="388" font-size="24" font-weight="400" fill="#596579" text-anchor="start">任务 / 事件</text><rect x="56" y="424" width="1088" height="232" rx="16" fill="#e9e8fc" stroke="#4f46e5" stroke-width="2"/><text x="84" y="480" font-size="38" font-weight="700" fill="#4f46e5" text-anchor="start">厂商托管控制面</text><text x="84" y="538" font-size="32" font-weight="400" fill="#172033" text-anchor="start">模型调用循环  ·  上下文管理  ·  会话状态</text><text x="84" y="600" font-size="32" font-weight="400" fill="#172033" text-anchor="start">工具编排  ·  多 Agent 协调</text><text x="56" y="713" font-size="28" font-weight="400" fill="#596579" text-anchor="start">工具请求与结果跨越控制面 / 执行面边界</text><rect x="56" y="797" width="508" height="184" rx="16" fill="#ffffff" stroke="#d8dce3" stroke-width="2"/><text x="84" y="853" font-size="37" font-weight="700" fill="#172033" text-anchor="start">厂商沙箱</text><text x="84" y="909" font-size="30" font-weight="400" fill="#596579" text-anchor="start">工具 · 文件 · 代码</text><text x="84" y="953" font-size="28" font-weight="400" fill="#596579" text-anchor="start">厂商管理执行环境</text><rect x="636" y="797" width="508" height="184" rx="16" fill="#def1eb" stroke="#0f766e" stroke-width="2"/><text x="664" y="853" font-size="37" font-weight="700" fill="#0f766e" text-anchor="start">自托管环境</text><text x="664" y="909" font-size="30" font-weight="400" fill="#596579" text-anchor="start">工具 · 文件 · 代码</text><text x="664" y="953" font-size="28" font-weight="400" fill="#596579" text-anchor="start">应用管理计算与生命周期</text><text x="56" y="1042" font-size="28" font-weight="400" fill="#596579" text-anchor="start">例外：OpenAI 可选 none，不启用完整沙箱。</text><rect x="56" y="1080" width="1088" height="92" rx="16" fill="#ffffff" stroke="#d8dce3" stroke-width="2"/><text x="84" y="1139" font-size="31" font-weight="600" fill="#0f766e" text-anchor="start">执行在内网 ≠ 工具输入输出不进入厂商控制面</text><path d="M56 1203 H1144" fill="none" stroke="#d8dce3"/><text x="56" y="1235" font-size="23" font-weight="400" fill="#596579" text-anchor="start">示意图 · 据官方文档整理 · 2026-09-15</text></g></svg>