<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1170" viewBox="0 0 1200 1170" role="img" aria-labelledby="title"><title id="title">可替换Agent执行端与自有验收交付控制层示意图</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c899b"/></marker></defs><rect width="100%" height="100%" fill="#f8f7f2"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="56" y="55" font-size="22" font-weight="600" fill="#4f46e5" text-anchor="start">W.ai  /  ENGINEERING NOTES  /  03</text><text x="56" y="120" font-size="48" font-weight="700" fill="#172033" text-anchor="start">把运行与交付分开</text><text x="56" y="171" font-size="27" font-weight="400" fill="#596579" text-anchor="start">建议架构；不代表现有系统已实现这些适配器。</text><path d="M600 387V444H235V494" fill="none" stroke="#7c899b" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 387V494" fill="none" stroke="#7c899b" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 387V444H966V494" fill="none" stroke="#7c899b" stroke-width="3" marker-end="url(#arrow)"/><path d="M235 700V760H600V814" fill="none" stroke="#7c899b" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 700V814" fill="none" stroke="#7c899b" stroke-width="3" marker-end="url(#arrow)"/><path d="M966 700V760H600V814" fill="none" stroke="#7c899b" stroke-width="3" marker-end="url(#arrow)"/><rect x="56" y="222" width="1088" height="165" rx="16" fill="#e9e8fc" stroke="#4f46e5" stroke-width="2"/><text x="84" y="278" font-size="39" font-weight="700" fill="#4f46e5" text-anchor="start">自有任务控制层 / OpenClaw</text><text x="84" y="341" font-size="30" font-weight="400" fill="#172033" text-anchor="start">任务账本  ·  权限与审批  ·  预算与最终期限</text><rect x="56" y="505" width="358" height="195" rx="16" fill="#ffffff" stroke="#d8dce3" stroke-width="2"/><text x="84" y="566" font-size="37" font-weight="700" fill="#172033" text-anchor="start">OpenAI</text><text x="84" y="621" font-size="29" font-weight="400" fill="#596579" text-anchor="start">Agents 执行端</text><text x="84" y="670" font-size="25" font-weight="400" fill="#0f766e" text-anchor="start">可替换执行路径</text><rect x="421" y="505" width="358" height="195" rx="16" fill="#ffffff" stroke="#d8dce3" stroke-width="2"/><text x="449" y="566" font-size="37" font-weight="700" fill="#172033" text-anchor="start">Claude</text><text x="449" y="621" font-size="29" font-weight="400" fill="#596579" text-anchor="start">Managed Agents</text><text x="449" y="670" font-size="25" font-weight="400" fill="#0f766e" text-anchor="start">可替换执行路径</text><rect x="786" y="505" width="358" height="195" rx="16" fill="#ffffff" stroke="#d8dce3" stroke-width="2"/><text x="814" y="566" font-size="37" font-weight="700" fill="#172033" text-anchor="start">原有执行端</text><text x="814" y="621" font-size="29" font-weight="400" fill="#596579" text-anchor="start">本地 / 其他模型</text><text x="814" y="670" font-size="25" font-weight="400" fill="#0f766e" text-anchor="start">可替换执行路径</text><rect x="56" y="825" width="1088" height="184" rx="16" fill="#def1eb" stroke="#0f766e" stroke-width="2"/><text x="84" y="885" font-size="39" font-weight="700" fill="#0f766e" text-anchor="start">统一验收与交付</text><text x="84" y="950" font-size="30" font-weight="400" fill="#172033" text-anchor="start">产物校验 → 资料归档 → 幂等发布 → 投递回执</text><text x="56" y="1065" font-size="29" font-weight="400" fill="#596579" text-anchor="start">运行结束、流关闭或 grader 通过，不等于业务成功。</text><path d="M56 1106 H1144" fill="none" stroke="#d8dce3"/><text x="56" y="1138" font-size="23" font-weight="400" fill="#596579" text-anchor="start">示意图 · 据官方文档整理 · 2026-09-15</text></g></svg>