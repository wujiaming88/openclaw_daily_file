<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="985" viewBox="0 0 1200 985" role="img" aria-labelledby="title"><title id="title">模型API、Agent SDK与托管Agent API的责任分配示意图</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c899b"/></marker></defs><rect width="100%" height="100%" fill="#f8f7f2"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="56" y="55" font-size="22" font-weight="600" fill="#4f46e5" text-anchor="start">W.ai  /  ENGINEERING NOTES  /  01</text><text x="56" y="120" font-size="48" font-weight="700" fill="#172033" text-anchor="start">三种接口，三种责任分配</text><text x="56" y="171" font-size="27" font-weight="400" fill="#596579" text-anchor="start">比较的是运行责任，不是模型能力高低。</text><rect x="56" y="216" width="1088" height="180" rx="16" fill="#ffffff" stroke="#d8dce3" stroke-width="2"/><text x="84" y="273" font-size="39" font-weight="700" fill="#172033" text-anchor="start">模型 API</text><text x="84" y="320" font-size="27" font-weight="400" fill="#4f46e5" text-anchor="start">Responses API / Messages API</text><text x="84" y="367" font-size="29" font-weight="400" fill="#596579" text-anchor="start">应用自行管理循环、工具执行、状态和恢复。</text><rect x="56" y="422" width="1088" height="180" rx="16" fill="#ffffff" stroke="#d8dce3" stroke-width="2"/><text x="84" y="479" font-size="39" font-weight="700" fill="#172033" text-anchor="start">Agent SDK</text><text x="84" y="526" font-size="27" font-weight="400" fill="#4f46e5" text-anchor="start">OpenAI Agents SDK / Claude Agent SDK</text><text x="84" y="573" font-size="29" font-weight="400" fill="#596579" text-anchor="start">框架辅助组织 Agent；部署与运行仍需自行承担。</text><rect x="56" y="628" width="1088" height="180" rx="16" fill="#e9e8fc" stroke="#d8dce3" stroke-width="2"/><text x="84" y="685" font-size="39" font-weight="700" fill="#172033" text-anchor="start">托管 Agent API</text><text x="84" y="732" font-size="27" font-weight="400" fill="#4f46e5" text-anchor="start">Agents API / Claude Managed Agents</text><text x="84" y="779" font-size="29" font-weight="400" fill="#596579" text-anchor="start">厂商运行 harness 和会话；执行环境可托管或自管。</text><text x="56" y="879" font-size="32" font-weight="600" fill="#0f766e" text-anchor="start">业务目标、授权和最终验收，仍由应用负责。</text><path d="M56 921 H1144" fill="none" stroke="#d8dce3"/><text x="56" y="953" font-size="23" font-weight="400" fill="#596579" text-anchor="start">示意图 · 据官方文档整理 · 2026-09-15</text></g></svg>